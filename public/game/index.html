<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0820" />
    <meta name="description" content="ネガティブな言葉を浄化していく開運アクションゲーム。スマホのブラウザでそのまま遊べます。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="邪気バスター" />
    <!-- 先頭スラッシュにすると Vite が base('/game/') を自動付与する -->
    <link rel="icon" type="image/png" sizes="32x32" href="/game/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/game/icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="邪気バスター" />
    <meta property="og:description" content="ネガティブな言葉を浄化していく開運アクションゲーム。" />
    <!-- OGPはSNSクローラが相対パスを解決しないため絶対URLで書く -->
    <meta property="og:url" content="https://www.reigaku.online/game" />
    <meta property="og:image" content="https://www.reigaku.online/game/ogp.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>邪気バスター</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f0820;
        overflow: hidden;
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #rotate-overlay {
        display: none;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-overlay {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 100;
          background: #0f0820;
          color: #ffd700;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font-family: sans-serif;
          font-size: 20px;
        }
        #rotate-overlay .phone {
          font-size: 48px;
          display: inline-block;
          transform: rotate(90deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/game/assets/index--rvGgIhK.js"></script>
    <link rel="stylesheet" crossorigin href="/game/assets/index-CvQJ0lNZ.css">
  <link rel="manifest" href="/game/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/game/registerSW.js"></script></head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-overlay"><span class="phone">📱</span>たてもちでプレイしてね</div>
  </body>
</html>
